name: build-sports

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generar sports.json
        env:
          FOOTBALL_KEY: ${{ secrets.FOOTBALL_KEY }}
        run: node scripts/build-sports.js
      - name: Publicar sports.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sports.json
          if git diff --staged --quiet; then echo "sin cambios"; else git commit -m "Actualizar sports.json" && git push; fi
